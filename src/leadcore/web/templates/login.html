<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — ReachDesk</title>
<style>
  :root { --accent:#475569; --bg:#f8f9fb; --card:#fff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --err:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:36px 32px; width:100%; max-width:380px; }
  .logo { font-size:22px; font-weight:700; color:var(--accent); text-align:center; margin-bottom:24px; letter-spacing:-.02em; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; font-weight:500; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; margin-bottom:16px; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(31,56,100,.12); }
  button { width:100%; padding:11px; background:var(--accent); color:#fff; border:none; border-radius:8px;
           font:inherit; font-weight:600; cursor:pointer; }
  button:hover { opacity:.92; }
  .error { background:#fef2f2; border:1px solid #fecaca; color:var(--err); border-radius:8px;
           padding:10px 12px; font-size:13px; margin-bottom:16px; }
  .footer { text-align:center; margin-top:18px; font-size:13px; color:var(--muted); }
  .footer a { color:var(--accent); text-decoration:none; font-weight:500; }
  .footer a:hover { text-decoration:underline; }
  .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--line); }
  .sso-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:11px;
             background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:8px;
             font:inherit; font-weight:600; cursor:pointer; text-decoration:none; transition:background .15s, border-color .15s; }
  .sso-btn:hover { background:#f9fafb; border-color:#d1d5db; }
  .sso-btn svg { flex-shrink:0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">ReachDesk</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  {% if sso_enabled %}
  <a href="/auth/sso" class="sso-btn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.01 24.01 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Sign in with SilverPush
  </a>
  <div class="divider">or</div>
  {% endif %}

  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <button type="submit">Log in</button>
  </form>
  <div class="footer">Don't have an account? <a href="/register">Register</a></div>
</div>
</body>
</html>
