<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}leadcore{% endblock %}</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e5e7eb; --accent:#1f3864;
    --a:#2e7d32; --b:#1565c0; --cp:#00838f; --cm:#ef6c00; --d:#c62828; --e:#757575;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:0 16px; }
  header .wrap { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 20px 0 0; padding:14px 0; }
  header a { color:#cdd7ee; text-decoration:none; padding:14px 12px; font-size:14px; }
  header a.active, header a:hover { color:#fff; box-shadow:inset 0 -3px 0 #fff; }
  main { max-width:1100px; margin:22px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  h2 { font-size:16px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  tr:hover td { background:#fafbfc; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .tile .n { font-size:26px; font-weight:700; }
  .tile .l { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:20px; color:#fff; font-size:12px; font-weight:600; }
  .t-A{background:var(--a)} .t-B{background:var(--b)} .t-Cp{background:var(--cp)} .t-Cm{background:var(--cm)}
  .t-D{background:var(--d)} .t-E{background:var(--e)}
  code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  a.link { color:var(--b); text-decoration:none; } a.link:hover { text-decoration:underline; }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button:hover { opacity:.92; }
  form.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); }
  .note { background:#fff8e1; border:1px solid #ffe082; border-radius:8px; padding:10px 12px; font-size:13px; }
  .bar { height:10px; border-radius:6px; background:var(--line); overflow:hidden; display:inline-block; width:120px; vertical-align:middle; }
  .bar > span { display:block; height:100%; background:var(--a); }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>leadcore</h1>
  {% for href, label in nav %}
    <a href="{{ href }}" class="{{ 'active' if request.url.path == href or (href != '/' and request.url.path.startswith(href)) else '' }}">{{ label }}</a>
  {% endfor %}
</div></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
{% macro grade_pill(g) %}{% set cls = {'A':'A','B':'B','C+':'Cp','C-':'Cm','C':'Cp','D':'D','E':'E'}[g] %}<span class="pill t-{{ cls }}">{{ g }}</span>{% endmacro %}
