[project]
name = "leadcore"
version = "0.1.0"
description = "Contact data foundation and deterministic email pattern engine"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "typer>=0.12",
    "anyascii>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leadcore = "leadcore.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
